services:
  - type: web
    name: turf-booking-management-software
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_PROVIDER
        value: supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_WEBHOOK_URL
        sync: false
      - key: NEXT_PUBLIC_ADMIN_WHATSAPP_NUMBER
        value: "8801712345678"
      - key: NEXT_PUBLIC_TURF_NAME
        value: Emerald Arena Turf & Box Cricket
      - key: NEXT_PUBLIC_TURF_LOCATION
        value: Dhanmondi / Mirpur Sports Zone, Dhaka
